name: Label issues by title

on:
  issues:
    types: [opened, edited]

permissions:
  contents: read
  issues: write

concurrency:
  group: label-issue-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  label:
    runs-on: ubuntu-latest
    steps:
      - uses: Libertas-le-Spes/OptimusBoard/label-issues@d1ba227628018b4295ed3c2df79cef0a6d67c4d9

name: Label issues by title

on:
  issues:
    types: [opened, edited]

permissions:
  contents: read
  issues: write

concurrency:
  group: label-issue-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  label:
    runs-on: ubuntu-latest
    steps:
      - uses: Libertas-le-Spes/OptimusBoard/label-issues@165aeb5fc3eea3eb14117df2b71b61cc86f46f10

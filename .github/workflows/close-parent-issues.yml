name: Close finished stories and epics

on:
  issues:
    types: [closed, reopened]

permissions:
  contents: read
  issues: write

concurrency:
  group: close-parent-issues
  cancel-in-progress: false
  queue: max

jobs:
  parents:
    runs-on: ubuntu-latest
    steps:
      - uses: Libertas-le-Spes/OptimusBoard/close-parent-issues@d1ba227628018b4295ed3c2df79cef0a6d67c4d9

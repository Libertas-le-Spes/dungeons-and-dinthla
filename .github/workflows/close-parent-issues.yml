name: Close finished stories and epics

on:
  issues:
    types: [closed, reopened]

permissions:
  contents: read
  issues: write

concurrency:
  group: close-parent-issues
  cancel-in-progress: false
  queue: max

jobs:
  parents:
    runs-on: ubuntu-latest
    steps:
      - uses: Libertas-le-Spes/OptimusBoard/close-parent-issues@165aeb5fc3eea3eb14117df2b71b61cc86f46f10
